	# Lazarus: stock mempool/frontend v3.3.1 nginx-mempool.conf plus the two blocks marked
	# "Lazarus theme". The Umbrel pre-start hook copies this into a directory that is
	# bind-mounted over /etc/nginx/conf.d, so the image's entrypoint still substitutes the
	# __MEMPOOL_BACKEND_* placeholders. Re-diff against the image on a frontend upgrade.
	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;

	index index.html;

	# Lazarus theme: inject the stylesheet + nav/footer script into every app shell.
	sub_filter '</head>' '<link rel="stylesheet" href="/lazarus/theme.css?v=fees26"><script src="/lazarus/theme.js?v=fees26"></script></head>';
	sub_filter_once on;

	# Lazarus theme: static assets, bind-mounted from the host.
	location /lazarus/ {
		alias /lazarus-theme/;
		expires 5m;
		add_header Cache-Control "public, max-age=300";
	}

	# Lazarus theme: our mining-pool logo. The frontend builds the badge image URL from the
	# pool's slug and falls back to default.svg (a pickaxe) when it 404s, so serving the Chi
	# Rho here is what puts our mark on Lazarus blocks in the block list, the block page and
	# the mining pool pages. Exact-match, so it wins over the /resources try_files below.
	location = /resources/mining-pools/lazarus.svg {
		alias /lazarus-theme/chi-rho.svg;
		default_type image/svg+xml;
		expires 5m;
		add_header Cache-Control "public, max-age=300";
	}

	# Lazarus theme: browser tab / touch icons, same mark on the pool's near-black.
	location = /resources/favicons/favicon.ico { alias /lazarus-theme/favicon.ico; expires 1h; }
	location = /resources/favicons/favicon-16x16.png { alias /lazarus-theme/favicon-16x16.png; expires 1h; }
	location = /resources/favicons/favicon-32x32.png { alias /lazarus-theme/favicon-32x32.png; expires 1h; }
	location = /resources/favicons/apple-touch-icon.png { alias /lazarus-theme/apple-touch-icon.png; expires 1h; }

	# enable browser and proxy caching
	add_header Cache-Control "public, no-transform";

	# vary cache if user changes language preference
	add_header Vary Accept-Language;
	add_header Vary Cookie;

	# fallback for all URLs i.e. /address/foo /tx/foo /block/000
	location / {
		try_files /$lang/$uri /$lang/$uri/ $uri $uri/ /en-US/$uri @index-redirect;
		expires 10m;
	}
	location /resources {
		try_files $uri @index-redirect;
		expires 1h;
	}

	# only cache /resources/config.* for 5 minutes since it changes often
	location /resources/config. {
		try_files $uri =404;
		expires 5m;
	}
	# only cache /resources/customize.* for 5 minutes since it changes often
	location /resources/customize. {
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) /$lang/index.html;
	}

	# location block using regex are matched in order

	# used for cookie override
	location ~ ^/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)/ {
		try_files $uri $uri/ /$1/index.html =404;
	}

	# static API docs
	location = /api {
		try_files $uri $uri/ /en-US/index.html =404;
	}
	location = /api/ {
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# Lazarus: BLAKE2b BTC (BTCB2). 10.21.0.1 is the Umbrel host on umbrel_main_network.
	# Do not use APP_MEMPOOL_API_IP (10.21.21.27) here — that is the stock Docker
	# backend, which still serves SHA CoinGecko prices. The hotfix API on the host
	# (:8999) and the pool UI (:8888) return the Neoxa+NonKYC volume-weighted price.
	location = /api/v1/historical-price {
		proxy_pass http://10.21.0.1:8999;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		add_header Cache-Control "no-store";
	}
	location = /api/v1/prices {
		proxy_pass http://10.21.0.1:8888/api/v1/prices;
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
		proxy_set_header Host $host;
	}

	# Clock / dashboard fiat (app-fiat, conversions$) arrives on this socket.
	# Docker API 10.21.21.27 still injects SHA CoinGecko here; hotfix has BTCB2.
	location /api/v1/ws {
		proxy_pass http://10.21.0.1:8999/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	location /api/v1/services {
		proxy_pass https://mempool.space;
	}
	# Address lookups walk electrs history and routinely exceed nginx's 60s default
	# (that is the 504 + "too many transactions" page). Give the backend time.
	location /api/v1 {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1;
		proxy_connect_timeout 10s;
		proxy_read_timeout 180s;
		proxy_send_timeout 180s;
	}
	location /api/ {
		proxy_pass http://__MEMPOOL_BACKEND_MAINNET_HTTP_HOST__:__MEMPOOL_BACKEND_MAINNET_HTTP_PORT__/api/v1/;
		proxy_connect_timeout 10s;
		proxy_read_timeout 180s;
		proxy_send_timeout 180s;
	}

	# mainnet API
	location /ws {
		proxy_pass http://10.21.0.1:8999/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
