[workspace]
resolver = "2"
members = ["wire", "tides", "primed"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/AwokenLazarus/Bitcoin"

[workspace.dependencies]
blake2 = "0.10"
sha2 = "0.10"
crypto_box = { version = "0.9", features = ["seal", "salsa20"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Money arithmetic: a wrapped u64 is a wrong payout, a panic is a restart. Keep the checks.
overflow-checks = true
