#!/usr/sbin/nft -f
# lazarus-hub base ruleset. Tailscale keeps its own iptables-nft tables; this table is ours.
table inet filter
delete table inet filter
table inet filter {
  set farm_allow { type ipv4_addr; flags interval; }
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
    ip6 nexthdr ipv6-icmp accept
    iifname "tailscale0" accept
    udp dport 41641 accept
    # bitcoin p2p (mining node). per-IP cap; stratum, prime 28915 and electrum 50002 open in phase 6
    tcp dport 8333 ct state new meter p2p_conn { ip saddr ct count over 8 } drop
    tcp dport 8333 accept
    # public Electrum over TLS (nginx stream -> electrs). per-IP connection cap and new-connection rate limit
    tcp dport 50002 ct state new meter electrum_conn { ip saddr ct count over 20 } drop
    tcp dport 50002 ct state new meter electrum_rate { ip saddr limit rate over 30/minute burst 30 packets } drop
    tcp dport 50002 accept
    # pool (STAGING until cutover): pooled stratum 23334, solo stratum 23335, DATUM prime 28915
    tcp dport { 3333, 3334, 23334, 23335 } ct state new meter stratum_conn { ip saddr ct count over 64 } drop
    tcp dport { 3333, 3334, 23334, 23335 } ct state new meter stratum_rate { ip saddr limit rate over 20/second burst 40 packets } drop
    tcp dport 28915 ct state new meter prime_conn { ip saddr ct count over 32 } drop
    tcp dport 28915 ct state new meter prime_rate { ip saddr limit rate over 10/second burst 20 packets } drop
    tcp dport { 3333, 3334, 23334, 23335, 28915 } accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
