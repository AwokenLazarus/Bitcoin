# Public Electrum over TLS -> local electrs (header-v2). Port stays firewalled until the DNS move is approved.
limit_conn_zone $binary_remote_addr zone=electrum_conn:10m;
upstream electrs_local { server 127.0.0.1:50011; }
server {
  listen 50002 ssl reuseport backlog=4096;
  ssl_certificate     /etc/ssl/lazarus/electrum.fullchain.pem;
  ssl_certificate_key /etc/ssl/lazarus/electrum.privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3; ssl_session_cache shared:electrum:20m; ssl_session_timeout 1h;
  limit_conn electrum_conn 20;
  proxy_pass electrs_local; proxy_connect_timeout 5s; proxy_timeout 30m; tcp_nodelay on;
}
