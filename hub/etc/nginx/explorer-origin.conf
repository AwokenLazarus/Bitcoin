# Origin for the explorer's Cloudflare Pages site (reached only through the Cloudflare tunnel).
# Same API and websocket routing the node's nginx does at home; no static pages here.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
proxy_cache_path /srv/node-services/explorer/nginx-cache levels=1:2 keys_zone=explorer_api:64m max_size=4g inactive=10m use_temp_path=off;
upstream mempool_backend { server 127.0.0.1:8999; keepalive 64; }
server {
  listen 127.0.0.1:3006 backlog=4096;
  access_log off;
  client_max_body_size 10m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;

  location = /api/v1/historical-price { proxy_pass http://mempool_backend; proxy_read_timeout 15s; add_header Cache-Control "no-store"; }
  # at home this goes to the pool UI on :8888; the Lazarus backend serves the same BTCB2 price feed
  location = /api/v1/prices { proxy_pass http://mempool_backend/api/v1/prices; proxy_read_timeout 15s; }
  location /api/v1/ws { proxy_pass http://mempool_backend/; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 1h; }
  location /ws        { proxy_pass http://mempool_backend/; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 1h; }
  location /api/v1/services { proxy_pass https://mempool.space; proxy_ssl_server_name on; proxy_set_header Host mempool.space; }
  # compress JSON towards the tunnel (address histories and block tx lists are 100 KB+)
  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any; gzip_vary on;
  gzip_types application/json text/plain application/javascript;

  # cache tiers: confirmed blocks and mining/statistics aggregates change slowly; everything else 2 s.
  # proxy_cache_lock collapses concurrent identical requests into one backend call.
  location ~ ^/api/v1/(block|blocks-bulk)/ { proxy_pass http://mempool_backend; proxy_read_timeout 180s;
    proxy_cache explorer_api; proxy_cache_valid 200 60s; proxy_cache_valid 404 5s; proxy_cache_lock on; proxy_cache_use_stale updating error timeout; add_header X-Origin-Cache $upstream_cache_status always; }
  location ~ ^/api/v1/(mining|statistics|lightning)/ { proxy_pass http://mempool_backend; proxy_read_timeout 180s;
    proxy_cache explorer_api; proxy_cache_valid 200 30s; proxy_cache_lock on; proxy_cache_use_stale updating error timeout; add_header X-Origin-Cache $upstream_cache_status always; }
  # address lookups walk electrs history; give the backend time. Short micro-cache absorbs bursts.
  location /api/v1 { proxy_pass http://mempool_backend/api/v1; proxy_connect_timeout 10s; proxy_read_timeout 180s; proxy_send_timeout 180s;
    proxy_cache explorer_api; proxy_cache_valid 200 2s; proxy_cache_lock on; proxy_cache_use_stale updating error timeout; proxy_cache_methods GET HEAD; add_header X-Origin-Cache $upstream_cache_status always; }
  location /api/   { proxy_pass http://mempool_backend/api/v1/; proxy_connect_timeout 10s; proxy_read_timeout 180s; proxy_send_timeout 180s; }
  location / { return 404; }
}
