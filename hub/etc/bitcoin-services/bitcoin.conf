# lazarus-hub services node: serves Electrum, explorer, wallets, REST. Never used for mining.
chain=main
consensusrules=rdts
prune=0
txindex=1
blockfilterindex=1
peerblockfilters=1
coinstatsindex=1
rest=1
server=1
disablewallet=0
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=9342
# tuned for heavy concurrent RPC from electrs + explorer
rpcthreads=32
rpcworkqueue=1024
rpcservertimeout=120
dbcache=16384
par=16
# P2P: private. Blocks come from the mining node over localhost; a few curated peers as a second source.
port=9343
whitebind=download,noban@127.0.0.1:9343
listen=1
discover=0
dnsseed=0
maxconnections=40
addnode=127.0.0.1:8333
whitelist=download,noban@127.0.0.1
persistmempool=1
maxmempool=1000
mempoolexpiry=336
blockreconstructionextratxn=32768
# same relay policy as the mining node so both mempools agree
datacarrier=1
datacarriersize=83
datacarriercost=1
acceptnonstddatacarrier=0
permitbaremultisig=0
permitbarepubkey=0
permitbaredatacarrier=0
rejectparasites=1
rejecttokens=1
maxscriptsize=1650
minrelaytxfee=0.00000100
incrementalrelayfee=0.00000100
addnode=107.221.0.147:8333
addnode=1.157.200.187:8333
addnode=136.24.46.236:8333
addnode=145.40.235.26:8333
addnode=154.44.31.55:8333
addnode=173.35.33.159:8333
rpccookieperms=group
rpcauth=explorer:<salt>$<hash>   # generated with rpcauth.py; the explorer.env on the hub holds the password
