# lazarus-hub mining node (full node, lean: no wallet, no indexes)
chain=main
consensusrules=rdts
prune=0
txindex=0
blockfilterindex=0
coinstatsindex=0
disablewallet=1
rest=0
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=9332
rpcworkqueue=128
port=8333
onlynet=ipv4
onlynet=ipv6
maxconnections=300
persistmempool=1
maxmempool=300
mempoolexpiry=336
maxorphantx=100
blockmaxweight=736000
blockmaxsize=300000
blockreconstructionextratxn=32768
blockreconstructionextratxnsize=10
# policy carried over from production
datacarrier=1
datacarriersize=83
datacarriercost=1
acceptnonstddatacarrier=0
permitbaremultisig=0
permitbarepubkey=0
permitbaredatacarrier=0
rejectparasites=1
rejecttokens=1
maxscriptsize=1650
minrelaytxfee=0.00000100
blockmintxfee=0.00000100
incrementalrelayfee=0.00000100
whitelist=download,noban@127.0.0.1
rpccookieperms=group
blocknotify=curl -fsS -m 2 -o /dev/null http://127.0.0.1:7152/NOTIFY
includeconf=/etc/bitcoin-mining/sync-stage.conf
