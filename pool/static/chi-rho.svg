  <path fill="none" stroke="#dbb565" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
        d="M16 3.2v25.6M16 3.2h2.2a3.7 3.7 0 0 1 0 7.4h-2.2M7.6 7.6 24.4 24.4M24.4 7.6 7.6 24.4"/>
</svg>
