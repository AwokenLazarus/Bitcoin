<!-- Chi Rho (labarum, U+2627): the Lazarus mark, identical to the mempool theme's copy at
     node/umbrel/mempool-theme/www/chi-rho.svg. pool.css masks the same geometry inline as
     --chi-rho so the wordmark's mark inherits --brass; this file is here for anything that
     needs a real image (touch icon, docs). -->
