<!-- The Lazarus crest: the Chi Rho of chi-rho.svg inside a laurel wreath, flanked by Alpha
     and Omega, after classical labarum art. Large surfaces only (the 180px touch icons,
     docs). The wreath and the two letters turn to mush much below that, so nav marks,
     favicons and the mining-pool badge all stay on the bare chi-rho.svg.
     Laid out from measurements of the reference art: wreath ring centred 0.58 of the way
     down the Chi Rho on its axis, branches spanning 46 to 147 degrees from 12 o'clock,
     stems crossing below and tapering to points; 10 leaves a row, two rows a branch. -->
